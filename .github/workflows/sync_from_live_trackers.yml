name: Sync from Live Trackers

on:
  schedule:
    # Runs daily at 10:00 UTC — after Live_Trackers pipeline completes (08:00 UTC)
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-tracker-data:
    name: Fetch Latest Data from Live_Trackers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Checkout Live_Trackers repository
        uses: actions/checkout@v6
        with:
          repository: Leerrooy95/Live_Trackers
          path: _live_trackers
          token: ${{ secrets.LIVE_TRACKERS_TOKEN }}

      - name: Sync tracker output data
        run: |
          mkdir -p output

          # Copy latest pipeline outputs (current state files)
          for file in node_status.json extracted_entities.json entity_kb_context.json convergence_report.json daily_intelligence.json live_verification.json fact_check.json rhetoric_reality.json chart_data.json; do
            if [ -f "_live_trackers/output/$file" ]; then
              cp "_live_trackers/output/$file" "output/$file"
              echo "✅ Synced $file"
            else
              echo "⚠️  $file not found in Live_Trackers output"
            fi
          done

          # Copy entity graph HTML (Stage 2.5 output)
          if [ -f "_live_trackers/docs/data/entity_graph.html" ]; then
            mkdir -p docs/data
            cp "_live_trackers/docs/data/entity_graph.html" "docs/data/entity_graph.html"
            echo "✅ Synced entity_graph.html"
          else
            echo "⚠️  entity_graph.html not found in Live_Trackers docs/data"
          fi

      - name: Clean up Live_Trackers checkout
        run: rm -rf _live_trackers

      - name: Commit and push synced data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ docs/data/

          if ! git diff --cached --quiet; then
            git commit -m "📡 Sync: Latest tracker data from Live_Trackers ($(date -u '+%Y-%m-%d'))"

            MAX_RETRIES=3
            for i in $(seq 1 $MAX_RETRIES); do
              echo "--- Push attempt $i of $MAX_RETRIES ---"
              git fetch origin main
              if ! git merge origin/main --no-edit --strategy-option=ours; then
                git merge --abort 2>/dev/null || true
                sleep $((i * 2))
                continue
              fi
              if git push origin main; then
                echo "✅ Push succeeded on attempt $i"
                exit 0
              fi
              sleep $((i * 2))
            done

            echo "::error::Failed to push after $MAX_RETRIES attempts"
            exit 1
          else
            echo "No changes to sync."
          fi
