name: Sync AI Context to Drop Box

on:
  workflow_run:
    workflows: ["Daily Intelligence Pipeline"] # Watches your main pipeline
    types:
      - completed
  workflow_dispatch: # Keeps the manual "Run" button enabled for testing

jobs:
  sync-to-space:
    runs-on: ubuntu-latest
    
    # This ensures it ONLY runs if the main pipeline succeeded, or if you click the manual run button
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync AI Context to DO Space
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          AWS_DEFAULT_REGION: sfo3
     
       run: |
          # Sync the AI Context Index
          aws s3 sync ./_AI_CONTEXT_INDEX s3://regulated-friction-space/_AI_CONTEXT_INDEX/ --endpoint-url https://sfo3.digitaloceanspaces.com
          
          # Sync the daily Scout output and intel files
          aws s3 sync ./output s3://regulated-friction-space/output/ --endpoint-url https://sfo3.digitaloceanspaces.com
          
          # Sync the correlation data
          aws s3 sync ./Control_Proof s3://regulated-friction-space/Control_Proof/ --endpoint-url https://sfo3.digitaloceanspaces.com
