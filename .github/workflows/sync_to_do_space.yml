name: Sync AI Context to Drop Box

on:
  workflow_run:
    workflows: ["Daily Intelligence Pipeline"]
    types:
      - completed
  workflow_dispatch:

jobs:
  sync-to-space:
    runs-on: ubuntu-latest
    
    # Only run if main pipeline succeeded, or if manually triggered
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    # Scoped permissions for OPSEC
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync AI Context Index to DO Space
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          AWS_DEFAULT_REGION: sfo3
        run: |
          aws s3 sync ./_AI_CONTEXT_INDEX s3://regulated-friction-space/_AI_CONTEXT_INDEX/ \
            --endpoint-url https://sfo3.digitaloceanspaces.com \
            --delete

      - name: Sync Output Intel to DO Space
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          AWS_DEFAULT_REGION: sfo3
        run: |
          aws s3 sync ./output s3://regulated-friction-space/output/ \
            --endpoint-url https://sfo3.digitaloceanspaces.com \
            --delete \
            --exclude ".api_budget.json"

      - name: Sync Correlation Data to DO Space
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          AWS_DEFAULT_REGION: sfo3
        run: |
          aws s3 sync ./Run_Correlations_Yourself s3://regulated-friction-space/Run_Correlations_Yourself/ \
            --endpoint-url https://sfo3.digitaloceanspaces.com \
            --delete

      - name: Sync Control Proof Data to DO Space
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          AWS_DEFAULT_REGION: sfo3
        run: |
          aws s3 sync ./Control_Proof s3://regulated-friction-space/Control_Proof/ \
            --endpoint-url https://sfo3.digitaloceanspaces.com \
            --delete
