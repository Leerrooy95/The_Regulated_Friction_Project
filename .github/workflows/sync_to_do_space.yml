name: Sync to DigitalOcean Space

on:
  workflow_run:
    workflows: ["Sync from Live Trackers"]
    types:
      - completed
  push:
    branches: [main]
    paths:
      - '_AI_CONTEXT_INDEX/**'
      - 'Run_Correlations_Yourself/**'
      - 'Control_Proof/**'
      - 'Report.md'
      - 'README.md'
  workflow_dispatch:

jobs:
  sync-to-space:
    name: Sync Data to DigitalOcean Space
    runs-on: ubuntu-latest

    # Only run if triggering workflow succeeded, or if triggered by push/manual
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync AI Context Index to DO Space
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          AWS_DEFAULT_REGION: sfo3
        run: |
          aws s3 sync ./_AI_CONTEXT_INDEX s3://regulated-friction-space/_AI_CONTEXT_INDEX/ \
            --endpoint-url https://sfo3.digitaloceanspaces.com \
            --delete

      - name: Sync Tracker Output to DO Space
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          AWS_DEFAULT_REGION: sfo3
        run: |
          aws s3 sync ./output s3://regulated-friction-space/output/ \
            --endpoint-url https://sfo3.digitaloceanspaces.com \
            --delete

      - name: Sync Correlation Data to DO Space
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          AWS_DEFAULT_REGION: sfo3
        run: |
          aws s3 sync ./Run_Correlations_Yourself s3://regulated-friction-space/Run_Correlations_Yourself/ \
            --endpoint-url https://sfo3.digitaloceanspaces.com \
            --delete

      - name: Sync Control Proof Data to DO Space
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          AWS_DEFAULT_REGION: sfo3
        run: |
          aws s3 sync ./Control_Proof s3://regulated-friction-space/Control_Proof/ \
            --endpoint-url https://sfo3.digitaloceanspaces.com \
            --delete

      - name: Sync Primary Reference Docs to DO Space
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          AWS_DEFAULT_REGION: sfo3
        run: |
          aws s3 cp ./Report.md s3://regulated-friction-space/Report.md \
            --endpoint-url https://sfo3.digitaloceanspaces.com
          aws s3 cp ./README.md s3://regulated-friction-space/README.md \
            --endpoint-url https://sfo3.digitaloceanspaces.com
          aws s3 cp ./14_Files/Glossary.md s3://regulated-friction-space/14_Files/Glossary.md \
            --endpoint-url https://sfo3.digitaloceanspaces.com
