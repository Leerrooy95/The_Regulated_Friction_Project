name: Daily Intelligence Pipeline

on:
  schedule:
    # Runs every day at 8:00 AM UTC
    - cron: '0 8 * * *' 
  workflow_dispatch: # Allows manual "Run" button in GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write 
      models: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scrapy pandas openai azure-ai-inference python-dotenv

      - name: Run Spider (Federal Register EOs)
        run: |
          scrapy crawl federal_register_eo -o output/latest_scrape.json

      - name: Run Perplexity Daily Intelligence Update
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: python daily_perplexity_update.py

      - name: Run Llama Scout Extraction
        continue-on-error: true
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: python test_api.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          
          # Check for changes
          if ! git diff --cached --quiet; then
            git commit -m "🤖 Daily update: spider scrape + Perplexity intelligence"
            
            # Robust push: fetch + merge (not rebase) with conflict auto-resolution.
            # In a merge, --strategy-option=ours keeps the CURRENT branch's version
            # of conflicting hunks, i.e. the runner's freshly generated data always wins.
            # Non-conflicting remote changes (e.g. docs edited on the Droplet) are
            # still incorporated normally.
            MAX_RETRIES=5
            for i in $(seq 1 $MAX_RETRIES); do
              echo "--- Push attempt $i of $MAX_RETRIES ---"
              
              git fetch origin main
              
              # Merge remote changes; auto-resolve conflicts keeping local data
              if ! git merge origin/main --no-edit --strategy-option=ours; then
                echo "::warning::Merge failed on attempt $i, aborting and retrying..."
                git merge --abort 2>/dev/null || true
                sleep $((i * 2))
                continue
              fi
              
              # Attempt push — may be rejected if remote moved again
              if git push origin main; then
                echo "✅ Push succeeded on attempt $i"
                exit 0
              fi
              
              echo "::warning::Push rejected on attempt $i (remote updated). Retrying..."
              sleep $((i * 2))
            done
            
            echo "::error::Failed to push after $MAX_RETRIES attempts"
            exit 1
          else
            echo "No new data to commit."
          fi
