name: Daily Intelligence Pipeline

on:
  schedule:
    # Runs every day at 8:00 AM UTC
    - cron: '0 8 * * *' 
  workflow_dispatch: # Allows manual "Run" button in GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history so rebase works properly

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scrapy pandas

      - name: Run Spider (Federal Register EOs)
        run: |
          # We save to a temp file so we don't accidentally overwrite the main database
          scrapy crawl federal_register_eo -o output/latest_scrape.json

      - name: Run Perplexity Daily Intelligence Update
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: |
          pip install openai
          python daily_perplexity_update.py

      - name: Run Llama Scout Extraction
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: |
          pip install azure-ai-inference python-dotenv
          python test_api.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          
          # Check for changes
          if ! git diff --cached --quiet; then
            git commit -m "🤖 Daily update: spider scrape + Perplexity intelligence"
            # The Magic Fix: Pull any changes from Droplet/Codespace first, then stack new data on top
            git pull origin main --rebase
            git push origin main
          else
            echo "No new data to commit."
          fi
