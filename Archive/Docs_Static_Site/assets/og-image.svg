<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1D3557"/>
      <stop offset="100%" style="stop-color:#14253d"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="473" x2="1200" y2="473"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Decorative correlation line (stylized) -->
  <polyline
    points="80,480 160,460 240,420 320,440 400,380 480,350 560,310 640,330 720,280 800,250 880,220 960,190 1040,170 1120,150"
    fill="none"
    stroke="#E63946"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.25"
  />
  <polyline
    points="80,500 160,490 240,470 320,450 400,410 480,400 560,360 640,350 720,320 800,290 880,270 960,240 1040,220 1120,200"
    fill="none"
    stroke="#457B9D"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.25"
  />

  <!-- Version tag -->
  <text x="600" y="115" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="14" letter-spacing="3" text-transform="uppercase">V9.5 — FEBRUARY 2026</text>

  <!-- Title -->
  <text x="600" y="185" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="46" font-weight="700">The Regulated Friction Project</text>

  <!-- Subtitle -->
  <text x="600" y="235" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="18">Temporal correlations between friction events, policy shifts, and capital flows</text>

  <!-- Divider -->
  <line x1="500" y1="275" x2="700" y2="275" stroke="#E63946" stroke-width="2" opacity="0.6"/>

  <!-- Core stat label -->
  <text x="600" y="320" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="13" letter-spacing="4">CORE FINDING</text>

  <!-- r value -->
  <text x="600" y="400" text-anchor="middle" fill="#E63946" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="80" font-weight="700">r = +0.6196</text>

  <!-- p value and context -->
  <text x="600" y="450" text-anchor="middle" fill="rgba(255,255,255,0.55)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="20">p = 0.0004 · 2-week lag · n = 30 weeks</text>

  <!-- Bottom stats -->
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" text-anchor="middle">
    <text x="300" y="530" fill="#457B9D" font-size="28" font-weight="700">71</text>
    <text x="300" y="555" fill="rgba(255,255,255,0.4)" font-size="13">Events Analyzed</text>

    <text x="600" y="530" fill="#457B9D" font-size="28" font-weight="700">93%</text>
    <text x="600" y="555" fill="rgba(255,255,255,0.4)" font-size="13">Response Rate</text>

    <text x="900" y="530" fill="#457B9D" font-size="28" font-weight="700">2017–2026</text>
    <text x="900" y="555" fill="rgba(255,255,255,0.4)" font-size="13">Coverage Period</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="610" width="1200" height="20" fill="#E63946" opacity="0.8"/>
</svg>
